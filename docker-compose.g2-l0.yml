services:
  timeweaver-event-mirror:
    environment:
      TIMEWEAVER_RUN_ID: ${TIMEWEAVER_RUN_ID}
      TIMEWEAVER_ENGINE_ID: ${TIMEWEAVER_ENGINE_ID}
      TIMEWEAVER_RESULTS: /results/v040/${TIMEWEAVER_RUN_ID}/g2-l0
      TIMEWEAVER_G1A_TIMEOUT: "420"
    entrypoint: ["python"]
    command: ["tools/g1a_event_mirror.py"]
  vllm-engine:
    volumes:
      - ./python/timeweaver_vllm:/workspace/GNUTimeWeaver/python/timeweaver_vllm:ro
    environment:
      TIMEWEAVER_RUN_ID: ${TIMEWEAVER_RUN_ID}
      TIMEWEAVER_ENGINE_ID: ${TIMEWEAVER_ENGINE_ID}
      TIMEWEAVER_RESULTS: /results/v040/${TIMEWEAVER_RUN_ID}/g2-l0
      TIMEWEAVER_VLLM_MODE: kv_layout_observation_only
  campaign-runner:
    entrypoint: ["python"]
    environment:
      G2_L0_RESULTS: /results/v040/${TIMEWEAVER_RUN_ID}/g2-l0
      G2_L0_FIXTURE: /results/v031/20260727T214500Z/g1-b/g1b-workloads-frozen.json
    command: ["tools/g2_l0_runner.py"]
