services:
  timeweaver-event-mirror:
    environment:
      TIMEWEAVER_RUN_ID: ${TIMEWEAVER_RUN_ID}
      TIMEWEAVER_ENGINE_ID: ${TIMEWEAVER_ENGINE_ID}
      TIMEWEAVER_G1C_RESULTS: /results/v031/${TIMEWEAVER_RUN_ID}/g1-c-hash-supplement
      TIMEWEAVER_G1C_TIMEOUT: "900"
    entrypoint: ["python"]
    command: ["tools/g1c_hash_mirror.py"]
  vllm-engine:
    environment:
      TIMEWEAVER_RUN_ID: ${TIMEWEAVER_RUN_ID}
      TIMEWEAVER_ENGINE_ID: ${TIMEWEAVER_ENGINE_ID}
      TIMEWEAVER_RESULTS: /results/v031/${TIMEWEAVER_RUN_ID}/g1-c-hash-supplement
  campaign-runner:
    entrypoint: ["python"]
    environment:
      TIMEWEAVER_G1C_RESULTS: /results/v031/${TIMEWEAVER_RUN_ID}/g1-c-hash-supplement
      TIMEWEAVER_G1B_FIXTURES: /results/v031/20260728T050000Z/g1-c-hash-supplement/fixture-workloads.json
    command: ["tools/g1c_hash_runner.py"]
